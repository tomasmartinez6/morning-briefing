      "summary": [
        "By late 1901, J.P. Morgan had assembled what he considered his masterwork of railroad consolidation: the Northern Securities Company, a holding company that controlled the Great Northern and Northern Pacific railroads and through them a commanding stake in the Chicago, Burlington & Quincy line. The three roads together ran from Chicago to Seattle and dominated rail transport across the entire northern tier of the country -- and the combination had been built partly to resolve a crisis.",
        "In the spring of 1901, Morgan's Great Northern and Edward Harriman's Union Pacific fought a secret war for control of the Northern Pacific. Both sides bought NP shares furiously and covertly, driving the stock from roughly $100 to over $1,000 in weeks. On May 9, 1901 -- the 'Northern Pacific Corner' -- brokers who had sold shares short scrambled to cover at any price, triggering a broader market panic in which sound stocks were dumped to raise emergency cash. The crisis lasted a single catastrophic day. The negotiated peace: put both railroad systems under one holding company. Northern Securities was incorporated in New Jersey in November 1901.",
        "Two months later, Theodore Roosevelt's Justice Department filed suit to dissolve it under the Sherman Antitrust Act.",
        "Roosevelt had been president for less than five months, elevated by McKinley's assassination in September 1901. Taking on Morgan was not the cautious move. When Morgan learned of the suit -- filed without any private warning -- he traveled to the White House. The exchange became one of the most quoted in American business history. Morgan said: 'If we have done anything wrong, send your man to my man and they can fix it up.' Roosevelt's response, delivered through Attorney General Philander Knox: 'We don't want to fix it up, we want to stop it.' Morgan then asked whether his other interests -- meaning U.S. Steel -- would also be attacked. Roosevelt told him they would not, unless they were found to have done 'something we regard as wrong.' It was a glimpse of how Roosevelt actually understood antitrust: not as a war on bigness, but as a tool to punish specific abuses.",
        "On March 14, 1904, the Supreme Court ruled 5-4 that Northern Securities violated the Sherman Act and ordered dissolution. The majority opinion, written by Justice John Marshall Harlan, held that holding companies assembled specifically to eliminate competition between parallel railroads were exactly what the Sherman Act was designed to prevent.",
        "The case established that the Sherman Act, passed in 1890 but largely dormant for a decade, had real federal teeth. Roosevelt's Justice Department went on to file 44 antitrust suits during his presidency. Northern Securities marked the beginning of the Progressive Era as an enforcement project -- not just a political mood -- and defined the antagonism between concentrated private financial power and federal regulation that would run through American economic history for the rest of the century."

      "summary": [
        "On the evening of December 12, 1900, a man named Charles Schwab gave a dinner speech at the University Club in New York that changed the shape of American industry. Schwab was the general manager of Carnegie Steel -- the most productive steel operation in the world -- and his subject was the theoretical case for a single, fully integrated American steel corporation: one company controlling ore mines, ships, blast furnaces, and finishing mills from end to end. The major financiers of the era were in the room. J.P. Morgan was in the room. Afterward, he had Schwab seated next to him and asked him to elaborate.",
        "Morgan was already the dominant figure in American railroad finance, having reorganized nearly a third of U.S. railroad mileage in the 1890s after a wave of overbuilding and bankruptcies. Steel was the next logical consolidation target. Within weeks of the Schwab dinner, Morgan authorized an approach to Carnegie himself. Schwab arranged a meeting at Carnegie's home. Carnegie listened, said he would think about it, and the next morning wrote his asking price on a slip of paper: $480 million. Schwab brought it to Morgan. Morgan looked at the number and said, without negotiating a single term: 'I accept.'",
        "The United States Steel Corporation was formally incorporated on February 26, 1901. It was the largest corporate transaction in American history to that point. The new company was capitalized at $1.4 billion -- equal to roughly 7 percent of the entire U.S. gross national product and equivalent to more than $400 billion today. Morgan had merged Carnegie's operation with nine other steel companies, creating an entity that controlled approximately 60 percent of the American steel industry and employed 168,000 workers. It was the first billion-dollar corporation in history.",
        "Carnegie's personal share came to roughly $226 million, which he immediately began converting into philanthropic endowments: public libraries in cities across the English-speaking world, universities, research institutions, and cultural foundations. He had entered business as a telegrapher's assistant and left it as a symbol of both American industrial possibility and its human costs. When Morgan and Carnegie later encountered each other on an ocean liner, Carnegie reportedly told him he should have asked for more. Morgan replied that he would have paid it.",
        "The creation of U.S. Steel alarmed reformers and trustbusters almost immediately. Theodore Roosevelt, who had assumed the presidency after McKinley's assassination in September 1901, initially chose not to challenge the deal, privately telling his attorney general that Morgan had acted in the public interest. That accommodation lasted eight years, until the Taft administration filed an antitrust suit in 1911. The Supreme Court ruled in U.S. Steel's favor in 1920, but the case -- dragging on nearly two decades -- helped define the legal framework for American antitrust enforcement that would shape corporate America throughout the 20th century."

let activeIndex = 0;
const chartInstances = [];

function renderTimeline(){
  const el = document.getElementById('timeline');
  el.innerHTML = '';
  newsletters.forEach((n, i) => {
    const btn = document.createElement('button');
    btn.className = 'stamp' + (i === activeIndex ? ' active' : '');
    const d = new Date(n.date + "T00:00:00");
    const label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    btn.innerHTML = `<span class="stamp-date">${label}</span><span class="stamp-label">${n.title}</span>`;
    btn.onclick = () => { activeIndex = i; window.location.hash = n.date; render(); };
    el.appendChild(btn);
  });
}

function renderIssue(){
  chartInstances.forEach(c => c.destroy());
  chartInstances.length = 0;

  const container = document.getElementById('issue');
  if(!newsletters.length){
    container.innerHTML = '<p class="empty-state">No briefings yet — the first run will appear here.</p>';
    return;
  }
  const n = newsletters[activeIndex];
  let html = `
    <p class="issue-eyebrow">Issue · ${n.displayDate}</p>
    <h1 class="issue-title">${n.title}</h1>
    <div class="issue-meta"><span>${n.wordCount} words</span><span>~${n.readMinutes} min read</span><span>${n.sections.length} topics</span></div>
  `;
  n.sections.forEach((s, si) => {
    html += `<section class="topic"><h2 class="topic-name">${s.topic}</h2><div class="topic-summary">`;
    s.summary.forEach(p => { html += `<p>${p}</p>`; });
    html += `</div>`;
    if(s.image){
      html += `<img class="topic-image" src="${s.image.url}" alt="${s.image.caption || ''}">`;
      if(s.image.caption) html += `<p class="topic-image-caption">${s.image.caption}</p>`;
    }
    if(s.chart){
      html += `
        <div class="chart-wrap">
          <p class="chart-title">${s.chart.title}</p>
          <div class="chart-canvas-box"><canvas id="chart-${activeIndex}-${si}"></canvas></div>
          ${s.chart.sourceNote ? `<p class="chart-source">${s.chart.sourceNote}</p>` : ''}
        </div>`;
    }
    if(s.diagram){
      const diagId = `diag-${activeIndex}-${si}`;
      html += `<div class="diagram-wrap">`;
      if(s.diagram.title) html += `<p class="diagram-title">${s.diagram.title}</p>`;
      html += `<div class="mermaid" id="${diagId}">${s.diagram.code}</div>`;
      html += `</div>`;
    }
    if(s.sources && s.sources.length){
      html += `<p class="sources">Sources: `;
      html += s.sources.map(src => `<a href="${src.url}" target="_blank" rel="noopener">${src.name}</a>`).join('');
      html += `</p>`;
    }
    html += `</section>`;
  });
  container.innerHTML = html;
  mermaid.run();

  n.sections.forEach((s, si) => {
    if(!s.chart) return;
    const ctx = document.getElementById(`chart-${activeIndex}-${si}`);
    const inst = new Chart(ctx, {
      type: s.chart.type || 'bar',
      data: {
        labels: s.chart.labels,
        datasets: [{
          data: s.chart.data,
          backgroundColor: s.chart.data.map(v => v < 0 ? '#B4573F' : '#33594F'),
          borderRadius: 3,
          maxBarThickness: 46
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => ` ${ctx.formattedValue}${s.chart.unit || ''}`
            }
          }
        },
        scales: {
          y: {
            grid: { color: 'rgba(30,34,48,0.08)' },
            ticks: { font: { family: 'IBM Plex Mono', size: 10 }, callback: v => v + (s.chart.unit || '') }
          },
          x: {
            grid: { display: false },
            ticks: { font: { family: 'IBM Plex Mono', size: 10 } }
          }
        }
      }
    });
    chartInstances.push(inst);
  });
}

function render(){
  renderTimeline();
  renderIssue();
}

mermaid.initialize({ startOnLoad: false, theme: 'neutral', themeVariables: { fontSize: '13px' } });

function resolveInitialIndex(){
  const hash = window.location.hash.replace('#', '').trim();
  if(!hash) return 0;
  const found = newsletters.findIndex(n => n.date === hash);
  return found >= 0 ? found : 0;
}

window.addEventListener('hashchange', () => {
  activeIndex = resolveInitialIndex();
  render();
});

activeIndex = resolveInitialIndex();
render();
